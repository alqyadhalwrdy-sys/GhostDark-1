<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشبح المظلم</title>
<style>
body{background:#0a0e14;color:#fff;font-family:system-ui;text-align:center;padding-top:60px}
.btn{background:#1a2332;border:1px solid #2a3a52;color:#8aa0c0;padding:14px 28px;border-radius:12px;width:85%;max-width:320px;margin:10px auto;display:block;cursor:pointer;font-size:16px}
.input{background:#0f1720;border:1px solid #1e90ff;color:#fff;padding:14px;border-radius:12px;width:85%;max-width:320px;margin:15px auto;display:block;text-align:center;font-size:18px}
.error{color:#888;margin-top:15px;font-size:13px}
.success{color:#55ff88}
</style>
</head>
<body>
<h1>الشبح المظلم</h1>
<div style="font-size:50px">♟</div>
<p>اطلب موافقة المالك لتفعيل التطبيق</p>
<button class="btn" id="reqBtn">طلب الموافقة عبر تيليجرام</button>
<p style="font-size:13px;color:#666">بعد إرسال الطلب، انتظر موافقة المالك</p>
<input class="input" id="codeInput" placeholder="رمز الموافقة">
<div id="msg" class="error">جاري الاتصال...</div>
<script>
const API="https://ghostdark-1.onrender.com";
const id = localStorage.getItem('ghost_id') || 'user_'+Math.random().toString(36).slice(2,9);
localStorage.setItem('ghost_id',id);
async function checkStatus(){
  try{
    const r=await fetch(API+"/api/status?id="+encodeURIComponent(id));
    const j=await r.json();
    if(j.status==='approved' || j.approved){
      document.getElementById('msg').innerHTML='<span class="success">✅ تمت الموافقة! التطبيق مفعل</span>';
    } else {
      document.getElementById('msg').innerHTML='✓ متصل بالسيرفر - بانتظار الموافقة<br>ID: '+id;
      document.getElementById('msg').className='success';
    }
  }catch(e){
    document.getElementById('msg').innerText='السيرفر يصحى... حدث الصفحة بعد 30 ثانية';
    fetch(API+'/').catch(()=>{});
  }
}
checkStatus();
document.getElementById('reqBtn').onclick=async()=>{
  const btn=document.getElementById('reqBtn');
  btn.innerText='جاري الإرسال...';
  try{
    await fetch(API+"/api/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id})});
    document.getElementById('msg').innerHTML='<span class="success">✅ تم إرسال الطلب للمالك عبر تيليجرام<br>انتظر الموافقة</span><br>ID: '+id;
  }catch(e){
    document.getElementById('msg').innerText='فشل: '+e.message;
  }
  btn.innerText='طلب الموافقة عبر تيليجرام';
};
</script>
</body>
</html>
